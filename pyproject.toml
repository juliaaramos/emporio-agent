[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (function calling + ferramentas determinísticas)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "rich>=13",
    "python-dotenv>=1.0",
    "holidays>=0.50",
    "tzdata>=2024.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
